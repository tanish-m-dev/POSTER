<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Poster</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.poster{
    width:350px;
    background:#222;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
    color:white;
    text-align:center;
}

.poster img{
    width:100%;
    height:500px;
    object-fit:cover;
}

.content{
    padding:20px;
}

h1{
    color:#FFD700;
    margin-bottom:10px;
}

.rating{
    color:#ff4444;
    font-size:20px;
    margin-bottom:10px;
}

p{
    color:#ddd;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:12px 30px;
    background:#ff4444;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#cc0000;
}
</style>

</head>
<body>

<div class="poster">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWXuqkSnL8oVrlVzBAvw-71snagNSUratgc4Iu0c9x8w&s=10" alt="Movie Poster">

<div class="content">

<h1>THE LEGEND</h1>

<div class="rating">⭐ 10 / 10</div>

<p>
An action-packed adventure filled with mystery, courage, and unforgettable moments.
Follow the hero's journey as he battles powerful enemies to save the world.
</p>

<button>🎬 Watch Now</button>

</div>

</div>

</body>
</html>
